[package]
name    = "jungey-kernel"
version = "0.1.0"
edition = "2021"
description = "Jungey OS microkernel (AArch64)"

[[bin]]
name = "jkernel"
path = "src/main.rs"

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic     = "abort"
lto       = true
opt-level = 2
debug     = true
