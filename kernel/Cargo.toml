[package]
name    = "jungey-kernel"
version = "0.8.0"
edition = "2021"
description = "Jungey OS microkernel (AArch64)"

[[bin]]
name = "jkernel"
path = "src/main.rs"

[features]
# Deliberately dereference a null pointer at the end of the stage 1 demo, to
# show the low half really is unmapped. `os/run.sh --fault`.
fault-demo = []

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic     = "abort"
lto       = true
opt-level = 2
debug     = true
